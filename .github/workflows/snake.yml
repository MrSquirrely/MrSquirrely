# Draws a snake eating the contribution graph and publishes it to the "output" branch.
# https://github.com/Platane/snk
name: Snake

on:
  # Once a day
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push: {branches: ["master"]}

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff218c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd800

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
